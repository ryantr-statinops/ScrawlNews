services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./logs:/app/logs
      - ./backups:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build: .
    command: celery -A src.worker.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

  bot:
    build: .
    command: python -m src.bot_entrypoint
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

  dagster-init:
    build: .
    command: dagster instance migrate
    env_file: .env
    environment:
      - DAGSTER_HOME=/app
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - TELEGRAM_ENABLED=false
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./dagster.yaml:/app/dagster.yaml:ro
      - ./workspace.yaml:/app/workspace.yaml:ro

  dagster-webserver:
    build: .
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    env_file: .env
    environment:
      - DAGSTER_HOME=/app
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - TELEGRAM_ENABLED=false
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./dagster.yaml:/app/dagster.yaml:ro
      - ./workspace.yaml:/app/workspace.yaml:ro
    ports:
      - "6768:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=2)\" && test -f /app/data/dagster/history/runs.db && test -f /app/data/dagster/schedules/schedules.db"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      dagster-init:
        condition: service_completed_successfully

  dagster-daemon:
    build: .
    command: dagster-daemon run
    env_file: .env
    environment:
      - DAGSTER_HOME=/app
      - DATABASE_URL=sqlite:///data/scrawlnews.db
      - TELEGRAM_ENABLED=false
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./dagster.yaml:/app/dagster.yaml:ro
      - ./workspace.yaml:/app/workspace.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "dagster-daemon liveness-check"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    depends_on:
      dagster-init:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api

  nginx:
    image: nginx:alpine
    ports:
      - "6767:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  redis_data:
